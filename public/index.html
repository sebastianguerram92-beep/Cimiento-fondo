<style>

@media (max-width:760px){
  .tabs{display:none}

  :root{--badge:52px} main{padding-bottom:calc(110px + var(--badge))}

<body>
<div id="app"><div class="wrap empty">Cargando Cimiento…</div></div>

<script>
(function(){
"use strict";
/* ---------- Íconos ---------- */
const LOGO = s => `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${[[4,36],[4,25],[18,36],[18,25],[18,14],[32,36],[32,25],[32,14]].map(([x,y])=>`<rect x="${x}" y="${y}" width="12" height="9" rx="1.5" fill="var(--brand)"/>`).join("")}<rect x="32" y="3" width="12" height="9" rx="1.5" fill="var(--amber)"/></svg>`;
const IC = {
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  mi:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  aportes:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  fondo:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gestion:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const icon = (k,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COP = n => "$" + Math.round(n||0).toLocaleString("es-CO");
const COP2 = n => "$" + (n||0).toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = (n,d=1) => (n||0).toLocaleString("es-CO",{minimumFractionDigits:0,maximumFractionDigits:d});
const PCT = (n,d=2) => (n||0).toLocaleString("es-CO",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mesNombre = p => { const [y,m]=p.split("-").map(Number); return MESES[m-1] + " " + y; };
const mesCorto = p => { const [y,m]=p.split("-").map(Number); return MESES[m-1].slice(0,3) + " " + String(y).slice(2); };
const fechaLarga = d => { if(!d) return "—"; const [y,m,dd]=d.split("-").map(Number); return dd + " " + MESES[m-1].slice(0,3) + " " + y; };
const toUTC = d => { const [y,m,dd]=d.split("-").map(Number); return Date.UTC(y,m-1,dd); };
const dias = (a,b) => Math.round((toUTC(b)-toUTC(a))/86400000);
const hoyReal = () => { const t=new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const ultimoDia = p => { const [y,m]=p.split("-").map(Number); return p + "-" + String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,"0"); };
const abre = o => o.vence.slice(0,8) + String(cfg().diaInicio).padStart(2,"0");
const ventana = o => { const v=o.vence, a=abre(o); return a < v ? "del " + Number(a.slice(8)) + " al " + fechaLarga(v) : "hasta el " + fechaLarga(v); };
const sigMes = p => { let [y,m]=p.split("-").map(Number); m++; if(m>12){m=1;y++;} return y+"-"+String(m).padStart(2,"0"); };
const sumDia = d => { const t=new Date(toUTC(d)+86400000); return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")+"-"+String(t.getUTCDate()).padStart(2,"0"); };
const iniciales = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const ss = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) }catch(e){} } };
async function hash(id, pass){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cimiento:" + id + ":" + pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------- Datos ---------- */
const COLS = ["config","miembros","obligaciones","pagos","usura"];
const S = { config:{}, miembros:{}, obligaciones:{}, pagos:{}, usura:{} };
let MODE = "cargando", PUBLICO = true, PORTAFOLIO = null;
const posiciones = () => { const c = S.config.fondo || {}; return (Array.isArray(c.posiciones) && c.posiciones.length ? c.posiciones : PORTAFOLIO) || []; };
const TKEY = "cim-token";
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} } };
let token = ls.get(TKEY);
async function api(path, opts={}){
  const headers = {"content-type":"application/json"};
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch("/api/" + path, {...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let data = {}; try { data = await res.json(); } catch(e){}
  if (res.status === 401 && token && !["entrar","crear-clave"].includes(path)) { salir(); }
  if (!res.ok) throw new Error(data.error || ("Error " + res.status));
  return data;
}
function salir(){ token=null; ls.set(TKEY,null); yo=null; }
async function cargar(){
  try {
    const d = token ? await api("estado").catch(()=>null) : null;
    const data = d || await api("publico");
    PUBLICO = !d;
    COLS.forEach(c=>S[c]=data[c]||{});
    // Tasa de usura publicada en el repo por la tarea mensual; lo cargado a mano en Gestión tiene prioridad.
    try { const u = await (await fetch("/usura.json", {cache:"no-store"})).json(); S.usura = {...(u.meses||{}), ...S.usura}; } catch(e){}
    try { if (!PORTAFOLIO) PORTAFOLIO = (await (await fetch("/portafolio.json", {cache:"no-store"})).json()).posiciones || []; } catch(e){ PORTAFOLIO = PORTAFOLIO || []; }
    if (d) yo = d.yo; else yo = null;
    MODE = "api";
  } catch(e){ if (MODE==="cargando"){ MODE="error"; } }
  render();
}
async function put(col, id, obj){
  S[col][id] = obj; render();
  try { await api("doc/"+col+"/"+encodeURIComponent(id), {method:"PUT", body:obj}); }
  catch(e){ toast("No se pudo guardar: " + e.message); }
  await cargar();
}
async function del(col, id){
  delete S[col][id]; render();
  try { await api("doc/"+col+"/"+encodeURIComponent(id), {method:"DELETE"}); }
  catch(e){ toast("No se pudo borrar: " + e.message); }
  await cargar();
}
const cfg = () => Object.assign({ nombre:"Fondo", valorNominal:1000, diaInicio:1, diaFin:5, mesesExclusion:3, penalidadExclusion:10, penalidadRetiro:5, interesesActivos:true, maxAlternativas:70, saldo:0, saldoFecha:"", invertidoAlternativas:0, tasaProyeccion:9.7, aporteProyeccion:161051, meta:50000000 }, S.config.fondo || {});

/* ---------- Reglas de negocio ---------- */
function hoy(){ return ss.get("cim-fecha-sim") || hoyReal(); }
function tasaUsura(fecha){
  const p = fecha.slice(0,7);
  const ks = Object.keys(S.usura).filter(k=>k<=p).sort();
  return ks.length ? Number(S.usura[ks[ks.length-1]].tasaEA) : null;
}
const interes = (monto, d, tasa) => (d>0 && tasa!=null) ? monto * (Math.pow(1 + tasa/100, d/365) - 1) : 0;
function obligacionesOrden(){ return Object.entries(S.obligaciones).map(([id,o])=>({id,...o})).sort((a,b)=>a.periodo.localeCompare(b.periodo)); }
function pagosDe(mid){ return Object.entries(S.pagos).map(([id,p])=>({id,...p})).filter(p=>p.miembro===mid); }
function totalesFondo(){
  const c = cfg();
  let aportado = 0;
  Object.values(S.pagos).forEach(p=>{ if(p.estado==="validado" && (p.tipo||"aporte")==="aporte") aportado += Number(p.monto); });
  const cuotas = aportado / c.valorNominal;
  const valorCuota = cuotas>0 && c.saldo>0 ? c.saldo / cuotas : c.valorNominal;
  return { aportado, cuotas, valorCuota, saldo:c.saldo, ganancia:c.saldo>0 ? c.saldo-aportado : 0 };
}
function estadoMiembro(mid){
  const c = cfg(), h = hoy(), T = totalesFondo();
  const pagos = pagosDe(mid).filter(p=>p.estado==="validado");
  const aporte = pagos.filter(p=>(p.tipo||"aporte")==="aporte");
  const aportado = aporte.reduce((s,p)=>s+Number(p.monto),0);
  const cuotas = aportado / c.valorNominal;
  let pendiente = 0, interesCausado = 0, sinTasa = false;
  const vencidas = [], proximas = [], hist = [];
  obligacionesOrden().forEach(o=>{
    const pagado = aporte.filter(p=>p.periodo===o.periodo).reduce((s,p)=>s+Number(p.monto),0);
    const falta = Math.max(0, Number(o.monto) - pagado);
    const vencida = h > o.vence;
    if (c.interesesActivos) {
      aporte.filter(p=>p.periodo===o.periodo && p.fecha > o.vence).forEach(p=>{
        const t = tasaUsura(o.vence); if (t==null) sinTasa = true;
        interesCausado += interes(Number(p.monto), dias(o.vence,p.fecha), t);
      });
    }
    if (falta>0 && vencida){
      const d = dias(o.vence, h), t = tasaUsura(o.vence);
      if (c.interesesActivos && t==null) sinTasa = true;
      const i = c.interesesActivos ? interes(falta, d, t) : 0;
      interesCausado += i; pendiente += falta;
      vencidas.push({...o, falta, dias:d, interes:i});
    } else if (falta>0) proximas.push({...o, falta, faltanDias:dias(h,o.vence), enVentana: h >= abre(o)});
    hist.push({...o, pagado, falta, vencida});
  });
  const interesPagado = pagos.filter(p=>p.tipo==="interes").reduce((s,p)=>s+Number(p.monto),0);
  const interesPendiente = Math.max(0, interesCausado - interesPagado);
  const meses = vencidas.length;
  const valor = cuotas * T.valorCuota;
  return {
    aportado, cuotas, valor, ganancia: valor - aportado,
    participacion: T.cuotas>0 ? cuotas/T.cuotas*100 : 0,
    pendiente, interesCausado, interesPagado, interesPendiente, sinTasa,
    vencidas, proximas, hist, meses,
    voto: meses===0,
    exclusion: meses >= c.mesesExclusion,
    penalidad: valor * c.penalidadExclusion/100,
    alDia: obligacionesOrden().filter(o=>o.vence < h).length - meses,
    totalVencidas: obligacionesOrden().filter(o=>o.vence < h).length,
    porValidar: pagosDe(mid).filter(p=>p.estado==="pendiente")
  };
}
function chipEstado(e){
  if (e.exclusion) return `<span class="pill bad"><span class="dot"></span>Causal de exclusión</span>`;
  if (e.meses>0) return `<span class="pill bad"><span class="dot"></span>En mora · ${e.meses} ${e.meses===1?"mes":"meses"}</span>`;
  if (e.proximas.length && e.proximas[0].enVentana) return `<span class="pill warn"><span class="dot"></span>Por vencer</span>`;
  return `<span class="pill ok"><span class="dot"></span>Al día</span>`;
}

function proyeccion(){
  const c = cfg(), T = totalesFondo(), n = Object.keys(S.miembros).length || 9;
  const base = (c.saldoFecha||hoy()).slice(0,7);
  let [y,m] = base.split("-").map(Number), saldo = T.saldo || T.aportado;
  const r = Math.pow(1 + c.tasaProyeccion/100, 1/12) - 1;
  const pts = [{p:base, v:saldo}];
  for (let i=0;i<72 && saldo < c.meta;i++){
    m++; if(m>12){m=1;y++;}
    const p = y+"-"+String(m).padStart(2,"0");
    const o = S.obligaciones[p];
    saldo = saldo*(1+r) + n*Number(o ? o.monto : c.aporteProyeccion);
    pts.push({p, v:saldo});
  }
  return pts;
}

function grafico(){
  const c = cfg();
  const porMes = {};
  Object.values(S.pagos).forEach(p=>{ if(p.estado==="validado"&&(p.tipo||"aporte")==="aporte") porMes[p.periodo]=(porMes[p.periodo]||0)+Number(p.monto); });
  const meses = Object.keys(porMes).sort(); let acc=0;
  const hist = meses.map(p=>({p, v:(acc+=porMes[p])}));
  const proy = proyeccion();
  if (!hist.length) return `<p class="muted">El gráfico aparece cuando haya aportes validados.</p>`;
  const all = [...hist.map(h=>h.p), ...proy.map(x=>x.p)];
  const p0 = all.sort()[0], pN = proy[proy.length-1].p;
  const idx = p => { const [a,b]=p.split("-").map(Number), [a0,b0]=p0.split("-").map(Number); return (a-a0)*12 + (b-b0); };
  const N = Math.max(1, idx(pN)), W=760, H=250, L=56, R=20, TOP=24, B=34;
  const maxV = Math.max(c.meta, ...proy.map(x=>x.v));
  const X = i => L + i*(W-L-R)/N, Y = v => TOP + (1 - v/maxV)*(H-TOP-B);
  const step = maxV/5; const ticks = [0,1,2,3,4,5].map(i=>i*step);
  const yrs = []; for(let i=0;i<=N;i++){ const [a0,b0]=p0.split("-").map(Number); const mm=(b0-1+i)%12; if(mm===0) yrs.push({i, y:a0+Math.floor((b0-1+i)/12)}); }
  const path = arr => arr.map((x,k)=>(k?"L":"M")+X(idx(x.p)).toFixed(1)+","+Y(x.v).toFixed(1)).join(" ");
  const last = proy[proy.length-1], reach = last.v >= c.meta;
  const hoyPt = proy[0];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Aportes acumulados y proyección del saldo hasta la meta de ${COP(c.meta)}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--soft)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" font-size="11">${t===0?"0":"$"+NUM(t/1e6,0)+" M"}</text>`).join("")}
    ${yrs.map(o=>`<text x="${X(o.i)}" y="${H-10}" text-anchor="middle" font-size="11">ene ${String(o.y).slice(2)}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${Y(c.meta)}" y2="${Y(c.meta)}" stroke="var(--amber)" stroke-dasharray="3 4"/>
    <path d="${path(proy)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="${path(hist)}" fill="none" stroke="var(--brand)" stroke-width="3"/>
    <circle cx="${X(idx(hoyPt.p))}" cy="${Y(hoyPt.v)}" r="5" fill="var(--brand)"/>
    ${reach?`<circle cx="${X(idx(last.p))}" cy="${Y(last.v)}" r="6" fill="var(--amber)"/><text x="${Math.min(X(idx(last.p)), W-R)}" y="${Y(last.v)-10}" text-anchor="end" font-size="12" style="fill:var(--fg);font-weight:600">${mesCorto(last.p)} · meta</text>`:""}
  </svg>`;
}

async function reducirImagen(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error("No se pudo leer la imagen")); i.src=url; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}
async function verComprobante(id){
  try {
    const res = await fetch("/api/comprobante/"+encodeURIComponent(id), {headers:{authorization:"Bearer "+token}});
    if(!res.ok) throw new Error("No disponible");
    const url = URL.createObjectURL(await res.blob());
    let d = document.getElementById("dlg-comp");
    if(!d){ d=document.createElement("dialog"); d.id="dlg-comp"; d.className="dlg"; document.body.appendChild(d); d.addEventListener("close",()=>{ const i=d.querySelector("img"); if(i) URL.revokeObjectURL(i.src); }); d.addEventListener("click",e=>{ if(e.target===d) d.close(); }); }
    d.innerHTML = `<div class="row"><strong>Comprobante</strong><button class="btn small ghost" onclick="this.closest('dialog').close()">Cerrar</button></div><img src="${url}" alt="Pantallazo de la consignación">`;
    d.showModal();
  } catch(e){ toast("No se pudo abrir el comprobante"); }
}

  const on = (id, fn) => { const f=document.getElementById(id); if(f) f.addEventListener("submit", ev=>{ ev.preventDefault(); fn(); }); };
  on("f-login", async()=>{ try { const d = await api("entrar",{method:"POST", body:{id:loginSel, pass:val("lg-pass")}}); token=d.token; ls.set(TKEY,token); loginMsg=""; location.hash="#mi"; await cargar(); } catch(e){ loginMsg=e.message; render(); } });
  on("f-crear", async()=>{ if(val("cp-1")!==val("cp-2")){ loginMsg="Las dos contraseñas no coinciden."; render(); return; } try { const d = await api("crear-clave",{method:"POST", body:{id:loginSel, pass:val("cp-1"), codigo:val("cp-cod")}}); token=d.token; ls.set(TKEY,token); loginMsg=""; location.hash="#mi"; await cargar(); toast("Contraseña creada"); } catch(e){ loginMsg=e.message; render(); } });
  on("f-pago", async()=>{ const monto=numVal("pg-monto"); if(!(monto>0)){ toast("Escribe un monto válido"); return; }
    const f=document.getElementById("pg-comp").files[0]; if(!f){ toast("Sube el pantallazo de la consignación"); return; }
    const btn=document.querySelector("#f-pago button.primary"); if(btn){ btn.disabled=true; btn.textContent="Enviando…"; }
    try {
      const comprobante = await reducirImagen(f);
      const d = await api("doc/pagos/"+uid(), {method:"PUT", body:{miembro:yo, tipo:val("pg-tipo"), periodo:val("pg-periodo"), monto, fecha:val("pg-fecha"), referencia:val("pg-ref").trim(), comprobante}});
      toast(d.aviso==="enviado" ? "Pago enviado. Le llegó un correo a quien valida." : "Pago enviado para validación");
    } catch(e){ toast("No se pudo enviar: "+e.message); }
    await cargar(); });
  on("f-obl", async()=>{ const p=val("ob-periodo"), monto=numVal("ob-monto"); if(!p||!(monto>0)){ toast("Escribe el mes y la cuota"); return; }
    const meses = [p, ...(document.getElementById("ob-adelante").checked ? Object.keys(S.obligaciones).filter(k=>k>p) : [])];
    try { for (const k of meses){ const prev=S.obligaciones[k]||{}; const {nota, ...resto}=prev; await api("doc/obligaciones/"+k,{method:"PUT", body:{...resto, periodo:k, monto, vence: prev.vence || (sigMes(k)+"-"+String(cfg().diaFin).padStart(2,"0"))}}); } toast(meses.length>1?`Cuota guardada en ${meses.length} meses`:"Cuota de "+mesNombre(p)+" guardada"); } catch(e){ toast("No se pudo guardar: "+e.message); }
    await cargar(); });
  const proyeccion = () => { const desde=val("pr-desde"), hasta=val("pr-hasta"), pct=Number(String(val("pr-pct")||"").replace(",","."));
    if(!desde||!hasta||hasta<desde||!(pct>=0)) return null;
    let ant=null; for (const k of Object.keys(S.obligaciones).sort()) if (k<desde) ant=k;
    if(!ant) return null; const base=Number(S.obligaciones[ant].monto)||0; if(!(base>0)) return null;
    const out=[]; let k=desde, n=1; while(k<=hasta && n<=60){ out.push({k, monto:Math.round(base*Math.pow(1+pct/100,n))}); k=sigMes(k); n++; }
    return {ant, base, pct, out}; };
  const vistaProy = () => { const el=document.getElementById("pr-vista"); if(!el) return; const r=proyeccion();
    el.innerHTML = r ? `Parte de ${mesNombre(r.ant)} (${COP(r.base)}). ${mesNombre(r.out[0].k)}: ${COP(r.out[0].monto)}${r.out.length>1?` … ${mesNombre(r.out[r.out.length-1].k)}: <strong>${COP(r.out[r.out.length-1].monto)}</strong>`:""} · ${r.out.length} ${r.out.length===1?"mes":"meses"}.` : "Revisa las fechas: debe existir una cuota en el mes anterior a \"Desde\"."; };
  ["pr-desde","pr-hasta","pr-pct"].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("input", vistaProy); }); vistaProy();
  on("f-proy", async()=>{ const r=proyeccion(); if(!r){ toast("Revisa las fechas y el porcentaje"); return; }
    const btn=document.querySelector("#f-proy button.primary"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
    try { for (const {k,monto} of r.out){ const prev=S.obligaciones[k]||{}; const {nota, ...resto}=prev; await api("doc/obligaciones/"+k,{method:"PUT", body:{...resto, periodo:k, monto, vence: prev.vence || (sigMes(k)+"-"+String(cfg().diaFin).padStart(2,"0"))}}); }
      toast(`Cuotas proyectadas: ${r.out.length} meses, hasta ${mesNombre(r.out[r.out.length-1].k)}`); } catch(e){ toast("No se pudo guardar: "+e.message); }
    await cargar(); });
  { const pm=document.getElementById("ob-periodo"); if(pm) pm.addEventListener("change", ()=>{ const o=S.obligaciones[pm.value]; if(o) document.getElementById("ob-monto").value=Math.round(o.monto); }); }
  on("f-saldo", async()=>{
    const pos = String(val("sd-pos")||"").split("\n").map(l=>l.split(";").map(x=>x.trim())).filter(p=>p[0]).map(([nombre,titular,tipo,pct])=>({nombre, titular:titular||"", tipo:/altern/i.test(tipo||"")?"alternativa":"renta fija", pct:Number(String(pct||"").replace(",","."))||0}));
    const total = pos.reduce((t,x)=>t+x.pct,0);
    if (pos.length && Math.abs(total-100)>0.5){ toast("Los porcentajes deben sumar 100% (suman "+NUM(total)+"%)"); return; }
    const saldo = numVal("sd-saldo");
    await put("config","fondo",{...cfg(), saldo, saldoFecha:val("sd-fecha"), posiciones:pos, invertidoAlternativas:pos.filter(x=>x.tipo==="alternativa").reduce((t,x)=>t+saldo*x.pct/100,0)}); toast("Saldo e inversiones actualizados"); });
  on("f-usura", async()=>{ const t=Number(String(val("us-tasa")).replace(",",".")); if(!(t>0&&t<100)){ toast("Escribe la tasa en % E.A., por ejemplo 25,5"); return; } await put("usura", val("us-mes"), {tasaEA:t}); toast("Tasa guardada"); });
  on("f-cfg", async()=>{ await put("config","fondo",{...cfg(), diaInicio:+val("cf-di"), diaFin:+val("cf-df"), mesesExclusion:+val("cf-me"), penalidadExclusion:+val("cf-pe"), penalidadRetiro:+val("cf-pr"), maxAlternativas:+val("cf-ma"), tasaProyeccion:+val("cf-tp"), aporteProyeccion:numVal("cf-ap"), interesesActivos:document.getElementById("cf-int").checked, cuentaAportes:val("cf-cta").trim()}); toast("Reglas guardadas"); });
  on("f-correos", async()=>{
    const norm = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    const ms = Object.entries(S.miembros), hechos = [], sinMatch = [];
    for (const linea of String(val("cr-lista")||"").split("\n")){
      const em = (linea.match(/[^\s:;,<>()`"']+@[^\s:;,<>()`"']+\.[a-z]{2,}/i)||[])[0]; if(!em) continue;
      const l = norm(linea.replace(em,""));
      const cand = ms.filter(([id,m])=>{ const p = norm(m.nombre).split(/\s+/); return p.length>1 ? l.includes(p[0]) && l.includes(p[p.length-1]) : l.includes(p[0]); });
      if (cand.length===1) hechos.push([cand[0][0], em.toLowerCase()]); else sinMatch.push(em);
    }
    if (!hechos.length){ toast("No encontré nombres de integrantes con correo en el texto"); return; }
    let err = 0;
    for (const [id,em] of hechos){ try { await api("doc/miembros/"+id, {method:"PUT", body:{...miembro(id), email:em}}); } catch(e){ err++; } }
    await cargar();
    toast(`Guardé ${hechos.length-err} correo${hechos.length-err===1?"":"s"}`+(sinMatch.length?`. Sin nombre reconocido: ${sinMatch.join(", ")}`:"")+(err?`. Fallaron ${err}`:""));
  });
  on("f-sim", ()=>{ const d=val("sm-fecha"); ss.set("cim-fecha-sim", d && d!==hoyReal() ? d : null); render(); toast("Fecha de prueba aplicada"); });
}
async function onAct(ev){
  const el = ev.currentTarget, a = el.dataset.act, id = el.dataset.id;
  if (a==="pick"){ loginSel=id; loginMsg=""; render(); const f=document.getElementById("lg-pass")||document.getElementById("cp-1"); if(f) f.focus(); }
  else if (a==="salir"){ salir(); loginSel=null; location.hash="#inicio"; await cargar(); }
  else if (a==="cargar-datos"){ const f=document.getElementById("carga-archivo").files[0]; if(!f){ toast("Elige el archivo"); return; } try { const body=JSON.parse(await f.text()); const d=await api("importar",{method:"POST", body}); loginMsg=""; toast("Datos cargados: "+(d.hechos.miembros||0)+" integrantes"); await cargar(); } catch(e){ loginMsg="No se pudo cargar: "+e.message; render(); } }
  else if (a==="ver-comp"){ verComprobante(id); }
  else if (a==="email"){ const v=(document.getElementById("em-"+id)||{}).value||""; await put("miembros", id, {...miembro(id), email:v.trim()}); toast("Correo guardado"); }
  else if (a==="drive-sync"){ try { const d=await api("drive-sincronizar",{method:"POST"}); toast(`Enviados ${d.ok}`+(d.fallos?`, fallaron ${d.fallos}`:"")+(d.quedan?`, quedan ${d.quedan} (vuelve a tocar)`:"")); } catch(e){ toast(e.message); } await cargar(); }
  else if (a==="recargar"){ MODE="cargando"; await cargar(); }
  else if (a==="sim-off"){ ss.set("cim-fecha-sim",null); render(); }
  else if (a==="validar"||a==="rechazar"){ const p=S.pagos[id]; await put("pagos", id, {...p, estado: a==="validar"?"validado":"rechazado", validadoPor:yo, validadoEn:new Date().toISOString()}); toast(a==="validar"?"Pago validado":"Pago rechazado"); }
  else if (a==="del-obl"){ await del("obligaciones", id); toast("Aporte quitado del calendario"); }
  else if (a==="rol"){ const m=miembro(id), r=el.dataset.rol, set=new Set(m.roles||[]); el.checked?set.add(r):set.delete(r); await put("miembros", id, {...m, roles:[...set]}); }
  else if (a==="reset"){ try { await api("reiniciar-clave",{method:"POST", body:{id}}); toast("Clave reiniciada: creará una nueva al entrar"); } catch(e){ toast(e.message); } await cargar(); }
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

/* ---------- Arranque ---------- */
cargar();
setInterval(()=>{ if (!document.hidden && !document.querySelector("form :focus")) cargar(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) cargar(); });
})();
</script>
